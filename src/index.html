<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>API 使用 demo</title>
    <!-- PWA：可安装到桌面/主屏，独立窗口运行 -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DeepSeek" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style>
      /*
       * 首帧兜底：这段样式和下面的脚本都不依赖 main.js / main.css，
       * 所以「HTML 到了」就能画出底色和骨架，不会先白一下再出内容。
       */
      html {
        background: rgb(255, 255, 255);
      }
      html[data-boot-theme='dark'] {
        background: rgb(21, 21, 23);
      }
      #root {
        min-height: 100%;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        color: #4d6bfe;
        font:
          600 15px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        letter-spacing: 0.02em;
      }
      .boot-bar {
        width: 96px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(77, 107, 254, 0.18);
      }
      .boot-bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: currentColor;
        animation: boot-slide 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar::after {
          width: 100%;
          animation: none;
        }
      }
    </style>
    <script>
      // 首帧主题：必须在样式包和 main.js 之前跑。
      // 应用里的深浅色是 JS 加 class 才生效的（services/theme.ts），这里先把 html 底色定下来，
      // 暗色模式下就不会出现「白闪一下再变黑」。
      ;(function () {
        try {
          var pref = localStorage.getItem('chat-demo:theme-preference')
          var dark =
            pref === 'dark' ||
            (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.bootTheme = dark ? 'dark' : 'light'
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (error) {
          // localStorage 不可用（隐私模式等）时按浅色渲染即可
        }
      })()
    </script>
  </head>
  <body>
    <!-- 骨架放在 #root 里：React 首次 render 会把它替换掉 -->
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div>DeepSeek</div>
        <div class="boot-bar"></div>
      </div>
    </div>
    <script>
      // Service Worker 注册 + 新版本自动生效。
      // file:// 下跳过（浏览器不允许 SW，且本站也支持直接开文件）。
      ;(function () {
        // 骨架如果 8 秒还没被 React 替换掉，多半是主包没下来，给个提示免得像卡死
        window.setTimeout(function () {
          var boot = document.querySelector('.boot')
          if (!boot) return
          var hint = document.createElement('div')
          hint.style.cssText = 'font-size:12px;font-weight:400;opacity:.7;letter-spacing:0'
          hint.textContent = '加载有点慢，检查网络后再刷新一次'
          boot.appendChild(hint)
        }, 8000)

        if (!('serviceWorker' in navigator) || location.protocol === 'file:') return

        var hadController = !!navigator.serviceWorker.controller
        var reloading = false

        function reloadOnce() {
          if (reloading) return
          reloading = true
          location.reload()
        }

        // 后台标签直接刷（用户看不到，零打断）；前台则给个提示，避免打断正在输入的提问
        function showUpdateHint() {
          if (document.getElementById('sw-update-hint')) return
          var el = document.createElement('button')
          el.id = 'sw-update-hint'
          el.type = 'button'
          el.textContent = '有新版本，点击刷新'
          el.style.cssText =
            'position:fixed;right:16px;bottom:16px;z-index:2147483647;padding:10px 16px;' +
            'border:0;border-radius:999px;background:#4d6bfe;color:#fff;cursor:pointer;' +
            'font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;' +
            'box-shadow:0 4px 16px rgba(0,0,0,.22)'
          el.addEventListener('click', reloadOnce)
          document.body.appendChild(el)
        }

        navigator.serviceWorker.addEventListener('controllerchange', function () {
          // 首次安装也会触发 controllerchange，此时不该刷新
          if (!hadController) return
          if (document.visibilityState === 'hidden') reloadOnce()
          else showUpdateHint()
        })

        // 立即注册（不等 load）：预缓存要尽早跑起来，第一次访问装好、之后打开就是秒开
        navigator.serviceWorker
          .register('sw.js', { updateViaCache: 'none' })
          .then(function (reg) {
            // 浏览器默认只在导航时检查更新，长时间不关的标签页会一直停在旧版
            setInterval(function () {
              reg.update().catch(function () {})
            }, 10 * 60 * 1000)
            document.addEventListener('visibilitychange', function () {
              if (document.visibilityState === 'visible') reg.update().catch(function () {})
            })
          })
          .catch(function () {})
      })()
    </script>
  </body>
</html>
